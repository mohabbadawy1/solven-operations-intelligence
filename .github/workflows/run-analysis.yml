name: Run Operations Intelligence

on:
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python app.py

      - name: Show generated report files
        run: |
          echo "Generated report files:"
          find . -type f \( -name "*.html" -o -name "*.json" -o -name "*.md" \) | sort

      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: operations-intelligence-report
          path: |
            **/*.html
            **/*.json
            **/*.md
          retention-days: 7
          if-no-files-found: error
