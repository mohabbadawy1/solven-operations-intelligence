name: Run Operations Intelligence

on:
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          python app.py

          echo "Checking generated reports..."

          test -f outputs/executive_report.json
          test -f outputs/executive_report.md
          test -f outputs/executive_report.html
          test -f outputs/executive_report.pdf

          echo "All report files were generated successfully."
          ls -lah outputs/

      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: operations-intelligence-report
          path: |
            outputs/executive_report.json
            outputs/executive_report.md
            outputs/executive_report.html
            outputs/executive_report.pdf
          retention-days: 7
          if-no-files-found: error
