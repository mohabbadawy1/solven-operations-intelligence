# Solven Real Estate Intelligence -- demo configuration.
#
# Centralizes the thresholds, weights, and targets that would
# realistically differ client-to-client (a coastal-heavy portfolio
# has different seasonality norms than an all-urban one; a lender-
# backed developer might set tighter overdue thresholds than a
# cash-rich one). Every analytics module in analysis/ reads its
# tunable constants from here via analysis._config rather than
# hardcoding them, so retargeting this platform at a real client's
# numbers is a config change, not a code change.
#
# All data referenced by this file (data/*.csv) is entirely synthetic,
# generated by generate_real_estate_data.py for the fictional company
# "Horizon Developments". No real company, project, customer, or
# financial figure is represented anywhere in this repository.

company:
  name: "Horizon Developments"
  platform_label: "Solven Real Estate Intelligence"
  report_type: "Real Estate Executive Intelligence Report"
  currency: "EGP"
  currency_symbol: "EGP"
  region: "Egypt / MENA"
  reporting_period_months: 24

# The identity the executive delivery email should be sent from. This
# platform builds the email's HTML/subject only (ai/email_renderer.py);
# actual sending stays owned by n8n (see README's "n8n owns orchestration
# only"), which cannot read this YAML file directly -- run_pipeline()
# writes these two values into outputs/email_meta.json alongside the PDF
# on every run precisely so n8n's email-send node can bind its "from
# name" / "from address" fields to them instead of hardcoding a person's
# inbox. hello@solvenhq.com must be a verified sender/domain in whatever
# transport n8n's email node uses (e.g. SMTP account or provider API key)
# before this takes effect -- see README's email delivery section.
email:
  sender_name: "Solven Intelligence"
  sender_email: "hello@solvenhq.com"

# Sales targets used for target-attainment KPIs. A real engagement
# would source these from the client's own budget; the demo sets
# plausible annual figures for a multi-project developer of Horizon's
# scale, expressed as net contracted sales value per year.
targets:
  annual_net_contracted_sales: 3_800_000_000
  annual_units_sold: 480
  quarterly_lead_to_contract_conversion_pct: 7.5
  collections_rate_pct: 92.0
  cancellation_rate_ceiling_pct: 8.0

# Health-score status bands, shared by every 0-100 score this platform
# computes (see analysis/executive_scoring.py). Applied uniformly so
# "Healthy" means the same thing on every dashboard card.
health_status_thresholds:
  healthy_floor: 80.0
  watch_floor: 65.0
  at_risk_floor: 50.0
  # below at_risk_floor => Critical

# Materiality-aware weights for the Overall Business Health score.
# Collections, cancellations, and construction delivery carry more
# weight than marketing efficiency or lead-funnel volume metrics,
# because a delayed handover or an underfunded receivables book is a
# harder, more expensive problem to unwind than a soft lead-quality
# quarter. Weights sum to 1.0; see analysis/executive_scoring.py for
# the component score each key maps to (construction_delivery_health
# and handover_readiness_health are both derived from
# analysis.construction_handover's own component breakdown, since that
# module analyzes both facets together).
overall_health_weights:
  commercial_health: 0.15
  sales_funnel_health: 0.08
  inventory_health: 0.06
  marketing_efficiency_health: 0.05
  collections_health: 0.18
  cancellations_health: 0.12
  construction_delivery_health: 0.16
  handover_readiness_health: 0.08
  customer_experience_health: 0.12

# Confidence methodology caps and increments -- identical formula
# shape to the logistics platform's correlation engine, carried over
# unchanged because it is domain-agnostic (see analysis/correlations.py).
confidence:
  base: 0.35
  strength_weight: 0.35
  per_convergence_signal: 0.10
  max_convergence_signals: 3
  cap: 0.97

# Anomaly / risk thresholds referenced across modules.
thresholds:
  stale_inventory_days: 180
  overdue_watch_days: 30
  overdue_critical_days: 90
  cancellation_rate_watch_pct: 8.0
  cancellation_rate_critical_pct: 15.0
  discount_watch_pct: 8.0
  discount_critical_pct: 12.0
  down_payment_risk_floor_pct: 10.0
  response_sla_minutes: 30
  construction_variance_watch_days: 30
  construction_variance_critical_days: 60
  broker_concentration_watch_pct: 20.0

# Forecast settings (transparent run-rate / weighted trend methods
# only -- see analysis/sales_performance.py and
# analysis/collections_risk.py). No black-box ML anywhere.
forecast:
  min_months_history: 3
  recent_trend_window_months: 3
  recent_trend_weight: 0.6
